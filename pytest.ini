[pytest]
# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出：显示每个用例名、简短回溯、跳过原因
addopts =
    -ra
    -q
    --strict-markers
    --tb=short

# 覆盖率（运行 make coverage 或 pytest --cov 时生效）
# 只统计业务代码，排除测试自身
[coverage:run]
source = src/llm_danmaku
omit =
    */tests/*
    */profile_runner.py

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING:
